  <text x="104" y="64" fill="#f7ede6" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">NOIR COMIC GENERATOR</text>
  <text x="48" y="154" fill="#fff4e9" font-family="Georgia, serif" font-size="55" font-weight="700">Your words.</text>
  <text x="48" y="219" fill="#fff4e9" font-family="Georgia, serif" font-size="55" font-weight="700">A world of noir.</text>
  <text x="50" y="260" fill="#d6ccd9" font-family="Arial, sans-serif" font-size="20">Turn writing into cinematic black-and-white comics.</text>
  <rect x="49" y="307" width="153" height="37" rx="18.5" fill="#ff7981"/>
