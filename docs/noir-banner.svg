<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Noir Comic Generator — Your words. A world of noir.</title>
  <desc id="description">A colorful marketing banner with coral, violet, teal, and gold accents, cinematic light beams, and decorative black-and-white film frames.</desc>
  <defs>
