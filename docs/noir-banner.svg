  <text x="281" y="331" text-anchor="middle" fill="#241b37" font-family="Arial, sans-serif" font-size="13" font-weight="700">1–24 FRAMES</text>
  <rect x="360" y="307" width="152" height="37" rx="18.5" fill="#65dfcf"/>
  <text x="436" y="331" text-anchor="middle" fill="#123530" font-family="Arial, sans-serif" font-size="13" font-weight="700">CINEMATIC NOIR</text>
