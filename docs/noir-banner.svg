      <stop offset="0" stop-color="#171829"/>
      <stop offset=".55" stop-color="#30203d"/>
      <stop offset="1" stop-color="#102e39"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6c75"/>
      <stop offset=".35" stop-color="#ac8bff"/>
      <stop offset=".7" stop-color="#56ddcf"/>
      <stop offset="1" stop-color="#ffd273"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dbdce2"/>
      <stop offset="1" stop-color="#3b3e4b"/>
    </linearGradient>
  </defs>
