plugins { id 'com.android.application' }

def appOrigin = providers.gradleProperty("appOrigin").get()
if (!(appOrigin ==~ /https:\/\/[a-zA-Z0-9.-]+(:[0-9]+)?/)) {
    throw new GradleException("appOrigin must be the verified HTTPS production origin.")
}
def signingPassword = System.getenv("ANDROID_UPLOAD_KEY_PASSWORD")
def uploadKey = rootProject.file("../.android-signing/noir-upload.p12")
def canSign = signingPassword != null && signingPassword.length() >= 6 && uploadKey.exists()
if (providers.gradleProperty("requireSigning").orElse("false").get() == "true" && !canSign) {
    throw new GradleException("Release signing requires ANDROID_UPLOAD_KEY_PASSWORD and the protected upload key.")
}

android {
    namespace 'ink.noircomics.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'ink.noircomics.app'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
        buildConfigField "String", "APP_ORIGIN", "\"${appOrigin}\""
        buildConfigField "String", "REVENUECAT_API_KEY", "\"goog_OEcIoWWLUkkgrvhzbudDZQTSQTc\""
    }
    signingConfigs {
        release {
            if (canSign) {
                storeFile uploadKey
                storePassword signingPassword
                keyAlias 'noir-upload'
                keyPassword signingPassword
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            if (canSign) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.assets.srcDirs += ['../../generated-artifacts/android/assets']
    }
}

dependencies {
    implementation 'com.revenuecat.purchases:purchases:9.13.0'
}
