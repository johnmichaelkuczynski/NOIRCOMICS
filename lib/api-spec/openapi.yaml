openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: comics
    description: Comic generation
paths:
  /comics/script:
    post:
      operationId: writeComicScript
      tags: [comics]
      summary: Develop a story idea into an editable script without generating images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryIdeaInput"
      responses:
        "200":
          description: An original script developed from the idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptDraft"
        "400":
          description: Invalid or unsupported idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Script writing failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /comics/transcribe:
    post:
      operationId: transcribeComicAudio
      tags: [comics]
      summary: Use AssemblyAI to transcribe a temporary microphone recording into input text
      requestBody:
        required: true
        content:
          audio/webm:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          audio/mp4:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          audio/wav:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          audio/mpeg:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          audio/ogg:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          audio/aac:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          audio/x-wav:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          video/webm:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          video/mp4:
            schema:
              $ref: "#/components/schemas/AudioRecording"
      responses:
        "200":
          description: The dictated text; audio is not persisted by this app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioTranscript"
        "400":
          description: Invalid recording or no speech
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Recording exceeds the 12 MB limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Unsupported recording format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Transcription failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /comics/providers:
    get:
      operationId: getComicProviders
      tags: [comics]
      summary: Check comic provider configuration and Venice connectivity
      responses:
        "200":
          description: Safe provider status, without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComicProviders"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /comics/jobs:
    post:
      operationId: startComicJob
      tags: [comics]
      summary: Start comic generation without holding a long gateway connection
      parameters:
        - in: header
          name: X-Comic-Request-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComicGenerationInput" }
      responses:
        "202":
          description: Generation accepted or existing matching job returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComicJob" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: Request key already used for different input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Generation capacity is full
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /comics/jobs/{jobId}:
    get:
      operationId: getComicJob
      tags: [comics]
      summary: Read the progress or result of this browser's generation
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Comic-Request-Key
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Pending job, completed comic, or original generation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComicJob" }
        "404":
          description: Job expired, server restarted, or access key does not match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /comics/generate:
    post:
      security: [{ NoirSession: [], NoirIntegrity: [], NoirNonce: [] }]
      operationId: generateComic
      tags: [comics]
      summary: Generate a noir comic from text
      description: Converts a short source text into the requested number of film-noir comic panels.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComicGenerationInput"
      responses:
        "200":
          description: The generated comic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComicGeneration"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    ComicJob:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, complete, failed] }
        comic: { $ref: "#/components/schemas/ComicGeneration" }
        error: { type: string }
    StoryIdeaInput:
      type: object
      properties:
        previousScript:
          type: string
          minLength: 1
          maxLength: 8000
          description: Optional previous version to avoid repeating when developing the same original idea.
        idea:
          type: string
          minLength: 1
          maxLength: 8000
        panelCount:
          type: integer
          minimum: 1
          maximum: 24
      required: [idea, panelCount]
    ScriptDraft:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        script:
          type: string
          minLength: 1
          maxLength: 8000
      required: [title, script]
    AudioRecording:
      type: string
      format: binary
      description: A temporary audio recording, maximum 12 MB.
    AudioTranscript:
      type: object
      properties:
        provider:
          type: string
          enum: [assemblyai]
        text:
          type: string
          minLength: 1
          maxLength: 8000
      required: [text, provider]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ComicGenerationInput:
      type: object
      properties:
        provider:
          type: string
          enum: [auto, openai, venice]
          description: Image provider. Auto uses Venice for supported non-explicit mature themes.
        text:
          type: string
          minLength: 1
          maxLength: 8000
          description: Source essay, story, or other short text.
        panelCount:
          type: integer
          minimum: 1
          maximum: 24
        styleReferenceImage:
          type: string
          minLength: 1
          maxLength: 6000000
          description: A data URI containing the supplied noir style reference image.
        characterReferences:
          type: array
          maxItems: 4
          description: Optional character likeness references for this generation only. Image 1 is the noir style reference; these photos follow in array order.
          items:
            $ref: "#/components/schemas/CharacterReference"
      required:
        - text
        - panelCount
        - styleReferenceImage
    CharacterReference:
      type: object
      required:
        - characterName
        - imageDataUri
      properties:
        characterName:
          type: string
          minLength: 1
          maxLength: 80
        instructions:
          type: string
          maxLength: 300
        imageDataUri:
          type: string
          minLength: 1
          maxLength: 2000000
          description: JPEG, PNG or WebP data URI. Not persisted as a reusable upload.
    ComicPanel:
      type: object
      properties:
        index:
          type: integer
          minimum: 1
        visualDescription:
          type: string
        dialogue:
          type: string
        imageDataUri:
          type: string
      required:
        - index
        - visualDescription
        - dialogue
        - imageDataUri
    ComicGeneration:
      type: object
      properties:
        providerUsed:
          type: string
          enum: [openai, venice]
        imageModel:
          type: string
        title:
          type: string
        panels:
          type: array
          minItems: 1
          maxItems: 24
          items:
            $ref: "#/components/schemas/ComicPanel"
      required:
        - title
        - panels
        - providerUsed
        - imageModel
    ComicProviders:
      type: object
      properties:
        maxCharacterReferences:
          type: integer
          minimum: 0
          maximum: 4
          description: Character-photo capacity supported by this server. Older servers omit this field.
        openaiConfigured:
          type: boolean
        veniceConfigured:
          type: boolean
        veniceConnected:
          type: boolean
        veniceMessage:
          type: string
        veniceImageModel:
          type: string
      required:
        - openaiConfigured
        - veniceConfigured
        - veniceConnected
        - veniceMessage
        - veniceImageModel
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

