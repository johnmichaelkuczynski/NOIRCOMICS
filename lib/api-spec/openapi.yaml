openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: comics
    description: Comic generation
paths:
  /billing/config:
    get:
      operationId: getBillingConfiguration
      tags: [comics]
      responses:
        "200":
          description: Protocol version and presence of required configuration; never returns credentials
          content:
            application/json:
              schema:
                type: object
                required: [version, serviceCredentials, projectNumber, signingCertificates, testPurchasesAllowed]
                properties:
                  version: { type: integer }
                  serviceCredentials: { type: boolean }
                  projectNumber: { type: string }
                  signingCertificates: { type: boolean }
                  testPurchasesAllowed: { type: boolean }
  /billing/challenge:
    get:
      operationId: getAndroidBillingChallenge
      tags: [comics]
      parameters:
        - in: query
          name: purpose
          required: true
          schema:
            type: string
            enum: [session, generation, receipt]
      responses:
        "200":
          description: One-use, short-lived, operation-bound Play Integrity challenge
          content:
            application/json:
              schema:
                type: object
                required: [version, nonce, cloudProjectNumber]
                properties:
                  version: { type: integer }
                  nonce: { type: string }
                  cloudProjectNumber: { type: string }
        "503":
          description: Google Play configuration is missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /billing/catalog:
    get:
      operationId: getVerifiedPlayCatalog
      tags: [comics]
      security: [{ NoirSession: [] }]
      responses:
        "200":
          description: Active P1M auto-renewing monthly plan, verified at USD 4.95 in the US region
          content:
            application/json:
              schema:
                type: object
                required: [usdPrice, billingPeriod, productId, basePlanId]
                properties:
                  usdPrice: { type: string }
                  billingPeriod: { type: string }
                  productId: { type: string }
                  basePlanId: { type: string }
  /billing/verify:
    post:
      operationId: verifyGooglePlayPurchase
      tags: [comics]
      security: [{ NoirSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayReceiptInput" }
      responses:
        "200":
          description: Google Developer API verified a paid, unexpired and acknowledged purchase
          content:
            application/json:
              schema:
                type: object
                required: [verified, subscribed, expiresAt, autoRenew]
                properties:
                  verified: { type: boolean }
                  subscribed: { type: boolean }
                  expiresAt: { type: string, format: date-time }
                  autoRenew: { type: boolean }
        "402":
          description: No verified paid access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: Missing, invalid or replayed native receipt ownership proof
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /billing/google-play/notifications:
    post:
      operationId: receiveGooglePlayNotification
      tags: [comics]
      summary: Authenticate Google PubSub OIDC delivery, then re-query Google; notifications cannot grant access by assertion
      responses:
        "204": { description: Notification processed idempotently }
        "401": { description: Unauthenticated delivery rejected }
  /billing/session:
    post:
      operationId: createBillingSession
      tags: [comics]
      summary: Establish an Android session only after fresh Play Integrity attestation; no paid access is implied
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingDeviceInput"
      responses:
        "200":
          description: Signed device session
          content:
            application/json:
              schema:
                type: object
                required: [version, customerId, token]
                properties:
                  version: { type: integer }
                  customerId: { type: string }
                  token: { type: string }
        "503":
          description: Generation remains blocked if billing is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /billing/usage:
    get:
      operationId: getBillingUsage
      tags: [comics]
      summary: Return server-authoritative remaining usage and verified subscription status
      parameters:
        - in: header
          name: X-Noir-Session
          schema: { type: string }
      responses:
        "200":
          description: Effective remaining allowances, including anti-abuse limits
          content:
            application/json:
              schema:
                type: object
                required: [version, customerId, subscribed, remaining, limits, monthlyLimits]
                properties:
                  version: { type: integer }
                  customerId: { type: string }
                  subscribed: { type: boolean }
                  remaining:
                    type: object
                    additionalProperties: { type: integer }
                  limits:
                    type: object
                    additionalProperties: { type: integer }
                  monthlyLimits:
                    type: object
                    additionalProperties: { type: integer }
        "503":
          description: Usage or subscription verification failed; no paid generation is allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /comics/script:
    post:
      security: [{ NoirSession: [], NoirIntegrity: [], NoirNonce: [] }]
      operationId: writeComicScript
      tags: [comics]
      summary: Develop a story idea into an editable script without generating images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryIdeaInput"
      responses:
        "200":
          description: An original script developed from the idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptDraft"
        "400":
          description: Invalid or unsupported idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Script writing failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /comics/transcribe:
    post:
      security: [{ NoirSession: [], NoirIntegrity: [], NoirNonce: [] }]
      operationId: transcribeComicAudio
      tags: [comics]
      summary: Use AssemblyAI to transcribe a temporary microphone recording into input text
      requestBody:
        required: true
        content:
          audio/webm:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          audio/mp4:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          audio/wav:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          audio/mpeg:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          audio/ogg:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          audio/aac:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          audio/x-wav:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          video/webm:
            schema:
              $ref: "#/components/schemas/AudioRecording"
          video/mp4:
            schema:
              $ref: "#/components/schemas/AudioRecording"
      responses:
        "200":
          description: The dictated text; audio is not persisted by this app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioTranscript"
        "400":
          description: Invalid recording or no speech
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Recording exceeds the 12 MB limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Unsupported recording format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Transcription failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /comics/providers:
    get:
      operationId: getComicProviders
      tags: [comics]
      summary: Check comic provider configuration and Venice connectivity
      responses:
        "200":
          description: Safe provider status, without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComicProviders"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /comics/generate:
    post:
      security: [{ NoirSession: [], NoirIntegrity: [], NoirNonce: [] }]
      operationId: generateComic
      tags: [comics]
      summary: Generate a noir comic from text
      description: Converts a short source text into the requested number of film-noir comic panels.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComicGenerationInput"
      responses:
        "200":
          description: The generated comic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComicGeneration"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    NoirSession: { type: apiKey, in: header, name: X-Noir-Session }
    NoirIntegrity: { type: apiKey, in: header, name: X-Noir-Integrity }
    NoirNonce: { type: apiKey, in: header, name: X-Noir-Nonce }
  schemas:
    BillingDeviceInput:
      type: object
      required: [deviceId, nonce, integrityToken]
      properties:
        deviceId:
          type: string
          pattern: "^[a-f0-9]{64}$"
        nonce: { type: string }
        integrityToken: { type: string }
    PlayReceiptInput:
      type: object
      required: [purchaseToken, nonce, integrityToken]
      properties:
        purchaseToken: { type: string, minLength: 5, maxLength: 8192 }
        nonce: { type: string }
        integrityToken: { type: string }
    StoryIdeaInput:
      type: object
      properties:
        previousScript:
          type: string
          minLength: 1
          maxLength: 8000
          description: Optional previous version to avoid repeating when developing the same original idea.
        idea:
          type: string
          minLength: 1
          maxLength: 8000
        panelCount:
          type: integer
          minimum: 1
          maximum: 24
      required: [idea, panelCount]
    ScriptDraft:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        script:
          type: string
          minLength: 1
          maxLength: 8000
      required: [title, script]
    AudioRecording:
      type: string
      format: binary
      description: A temporary audio recording, maximum 12 MB.
    AudioTranscript:
      type: object
      properties:
        provider:
          type: string
          enum: [assemblyai]
        text:
          type: string
          minLength: 1
          maxLength: 8000
      required: [text, provider]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ComicGenerationInput:
      type: object
      properties:
        provider:
          type: string
          enum: [auto, openai, venice]
          description: Image provider. Auto uses Venice for supported non-explicit mature themes.
        text:
          type: string
          minLength: 1
          maxLength: 8000
          description: Source essay, story, or other short text.
        panelCount:
          type: integer
          minimum: 1
          maximum: 24
        styleReferenceImage:
          type: string
          minLength: 1
          maxLength: 6000000
          description: A data URI containing the supplied noir style reference image.
      required:
        - text
        - panelCount
        - styleReferenceImage
    ComicPanel:
      type: object
      properties:
        index:
          type: integer
          minimum: 1
        visualDescription:
          type: string
        dialogue:
          type: string
        imageDataUri:
          type: string
      required:
        - index
        - visualDescription
        - dialogue
        - imageDataUri
    ComicGeneration:
      type: object
      properties:
        providerUsed:
          type: string
          enum: [openai, venice]
        imageModel:
          type: string
        title:
          type: string
        panels:
          type: array
          minItems: 1
          maxItems: 24
          items:
            $ref: "#/components/schemas/ComicPanel"
      required:
        - title
        - panels
        - providerUsed
        - imageModel
    ComicProviders:
      type: object
      properties:
        openaiConfigured:
          type: boolean
        veniceConfigured:
          type: boolean
        veniceConnected:
          type: boolean
        veniceMessage:
          type: string
        veniceImageModel:
          type: string
      required:
        - openaiConfigured
        - veniceConfigured
        - veniceConnected
        - veniceMessage
        - veniceImageModel
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

