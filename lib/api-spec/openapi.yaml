openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: comics
    description: Comic generation
paths:
  /comics/providers:
    get:
      operationId: getComicProviders
      tags: [comics]
      summary: Check comic provider configuration and Venice connectivity
      responses:
        "200":
          description: Safe provider status, without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComicProviders"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /comics/generate:
    post:
      operationId: generateComic
      tags: [comics]
      summary: Generate a noir comic from text
      description: Converts a short source text into the requested number of film-noir comic panels.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComicGenerationInput"
      responses:
        "200":
          description: The generated comic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComicGeneration"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ComicGenerationInput:
      type: object
      properties:
        provider:
          type: string
          enum: [auto, openai, venice]
          description: Image provider. Auto uses Venice for supported non-explicit mature themes.
        text:
          type: string
          minLength: 1
          maxLength: 8000
          description: Source essay, story, or other short text.
        panelCount:
          type: integer
          minimum: 1
          maximum: 24
        styleReferenceImage:
          type: string
          minLength: 1
          maxLength: 6000000
          description: A data URI containing the supplied noir style reference image.
      required:
        - text
        - panelCount
        - styleReferenceImage
    ComicPanel:
      type: object
      properties:
        index:
          type: integer
          minimum: 1
        visualDescription:
          type: string
        dialogue:
          type: string
        imageDataUri:
          type: string
      required:
        - index
        - visualDescription
        - dialogue
        - imageDataUri
    ComicGeneration:
      type: object
      properties:
        providerUsed:
          type: string
          enum: [openai, venice]
        imageModel:
          type: string
        title:
          type: string
        panels:
          type: array
          minItems: 1
          maxItems: 24
          items:
            $ref: "#/components/schemas/ComicPanel"
      required:
        - title
        - panels
        - providerUsed
        - imageModel
    ComicProviders:
      type: object
      properties:
        openaiConfigured:
          type: boolean
        veniceConfigured:
          type: boolean
        veniceConnected:
          type: boolean
        veniceMessage:
          type: string
        veniceImageModel:
          type: string
      required:
        - openaiConfigured
        - veniceConfigured
        - veniceConnected
        - veniceMessage
        - veniceImageModel
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

